openapi: 3.1.0
info:
  title: Jiwambe Rider API (draft)
  version: 0.1.0
  description: |
    Author's sketch for /riders/* upstream endpoints.
    NOT an API-team contract — all shapes are assumptions.
servers:
  - url: https://api.example.com/api/v1
    description: Example upstream (replace with JIWAMBE_API_BASE_URL)
tags:
  - name: auth
  - name: me
  - name: catalog
  - name: applications
  - name: facility
  - name: payments
paths:
  /riders/auth/otp/request:
    post:
      tags: [auth]
      summary: Request OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+254700000000"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
  /riders/auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_session_id, code]
              properties:
                otp_session_id:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /riders/me:
    get:
      tags: [me]
      summary: Current rider profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderMe"
  /riders/catalog/products:
    get:
      tags: [catalog]
      summary: List financiable products
      responses:
        "200":
          description: Product catalog
  /riders/catalog/quotes:
    post:
      tags: [catalog]
      summary: Compute quote (server-side only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
  /riders/applications:
    post:
      tags: [applications]
      summary: Submit application
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Application created
  /riders/facility:
    get:
      tags: [facility]
      summary: Active loan / ownership summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Facility
  /riders/asset:
    get:
      tags: [facility]
      summary: Bike asset + telemetry
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Asset
  /riders/payments/stk:
    post:
      tags: [payments]
      summary: Initiate STK push
      security:
        - bearerAuth: []
      responses:
        "200":
          description: STK initiated
  /riders/payments:
    get:
      tags: [payments]
      summary: Payment history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ledger
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    OtpRequestResponse:
      type: object
      properties:
        otp_session_id:
          type: string
        resend_available_in_seconds:
          type: integer
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          example: Bearer
    RiderMe:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        lifecycleStage:
          type: string
          enum: [PROSPECT, PENDING, ACTIVE, SUSPENDED]
        county:
          type: string
    QuoteRequest:
      type: object
      required: [productId, depositKes, termMonths, operatingModel]
      properties:
        productId:
          type: string
        depositKes:
          type: integer
        termMonths:
          type: integer
        operatingModel:
          type: string
          enum: [FLEET, STAGE, DELIVERY, PERSONAL]
    QuoteResponse:
      type: object
      properties:
        dailyAmountKes:
          type: integer
        minDepositKes:
          type: integer
        financedAmountKes:
          type: integer
        termMonths:
          type: integer
